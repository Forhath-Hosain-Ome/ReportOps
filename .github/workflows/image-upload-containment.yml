name: Image upload containment
on:
  pull_request:
    branches: [develop]
  push:
    branches: [fix/image-upload-containment]
permissions:
  contents: read
jobs:
  containment:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install repository-constrained test dependencies
        run: python -m pip install -c requirements.txt Django djangorestframework celery channels djangorestframework_simplejwt pillow python-docx openpyxl pandas xlrd pdfplumber pypdf
      - name: Test real filesystem, API and ownership boundaries
        run: python -B -m django test image_processor mail_download.tests --settings=image_processor.tests.settings --verbosity=2
